<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETF RAG Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header span.model-badge {
      font-size: 0.75rem;
      background: #e94560;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 400;
    }

    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
    }

    .message.user .bubble {
      background: #1a1a2e;
      color: #fff;
      border-radius: 12px 12px 4px 12px;
      padding: 10px 14px;
      display: inline-block;
      float: right;
    }

    .message.user { text-align: right; }

    .message.assistant .bubble {
      background: #fff;
      border: 1px solid #dde1e7;
      border-radius: 4px 12px 12px 12px;
      padding: 14px;
    }

    .answer-text {
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .sources {
      margin-top: 12px;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    .sources-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .source-chunk {
      font-size: 0.8rem;
      color: #555;
      background: #f7f8fa;
      border-left: 3px solid #e94560;
      padding: 6px 10px;
      margin-bottom: 5px;
      border-radius: 0 4px 4px 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .source-chunk .score {
      color: #e94560;
      font-weight: 600;
      white-space: nowrap;
    }

    .error-bubble {
      background: #fff0f0;
      border: 1px solid #f5c2c7;
      color: #842029;
      border-radius: 8px;
      padding: 12px 14px;
    }

    #input-area {
      padding: 14px 20px;
      background: #fff;
      border-top: 1px solid #dde1e7;
    }

    #input-form {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }

    #question {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #dde1e7;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #question:focus { border-color: #1a1a2e; }

    #submit-btn {
      padding: 10px 20px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #submit-btn:hover { background: #e94560; }
    #submit-btn:disabled { background: #999; cursor: not-allowed; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ccc;
      border-top-color: #1a1a2e;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .clearfix::after { content: ""; display: table; clear: both; }
  </style>
</head>
<body>

<header>
  ETF RAG System
  <span class="model-badge">{{ model }}</span>
</header>

<div id="chat-window"></div>

<div id="input-area">
  <form id="input-form">
    <input id="question" type="text" placeholder="Ask a question about ETF regulations..." autocomplete="off" />
    <button id="submit-btn" type="submit">Send</button>
  </form>
</div>

<script>
  const form = document.getElementById('input-form');
  const input = document.getElementById('question');
  const btn = document.getElementById('submit-btn');
  const window_ = document.getElementById('chat-window');

  function appendMessage(role, html) {
    const div = document.createElement('div');
    div.className = `message ${role} clearfix`;
    div.innerHTML = `<div class="bubble">${html}</div>`;
    window_.appendChild(div);
    window_.scrollTop = window_.scrollHeight;
    return div;
  }

  function scoreColor(score) {
    if (score >= 0.8) return '#22c55e';
    if (score >= 0.5) return '#f59e0b';
    return '#e94560';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    appendMessage('user', escapeHtml(question));
    input.value = '';
    btn.disabled = true;

    const loadingDiv = appendMessage('assistant',
      '<span class="spinner"></span> Thinking… (this can take ~20s)'
    );

    try {
      const res = await fetch('/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, top_k: 5 })
      });
      const data = await res.json();

      if (data.status === 'error') {
        loadingDiv.querySelector('.bubble').innerHTML =
          `<div class="error-bubble">Error: ${escapeHtml(data.error)}</div>`;
      } else {
        let html = `<div class="answer-text">${escapeHtml(data.answer || '')}</div>`;

        const sources = data.sources || [];
        if (sources.length > 0) {
          html += `<div class="sources">
            <div class="sources-title">Sources (${sources.length})</div>`;
          sources.forEach(s => {
            const score = typeof s.score === 'number' ? s.score.toFixed(3) : '—';
            const text = (s.text || s.content || '').slice(0, 200);
            html += `<div class="source-chunk">
              <span>${escapeHtml(text)}${text.length >= 200 ? '…' : ''}</span>
              <span class="score" style="color:${scoreColor(s.score)}">${score}</span>
            </div>`;
          });
          html += `</div>`;
        }

        loadingDiv.querySelector('.bubble').innerHTML = html;
      }
    } catch (err) {
      loadingDiv.querySelector('.bubble').innerHTML =
        `<div class="error-bubble">Network error: ${escapeHtml(err.message)}</div>`;
    } finally {
      btn.disabled = false;
      window_.scrollTop = window_.scrollHeight;
    }
  });

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
